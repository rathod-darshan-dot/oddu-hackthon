<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Trip - Traveloop</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body{
      min-height: 100vh;
      background: linear-gradient(-45deg,#0f172a,#1e3a8a,#7c3aed,#0f172a);
      background-size: 400% 400%;
      animation: gradient 10s ease infinite;
      color: white;
      overflow-x: hidden;
    }

    @keyframes gradient{

      0%{
        background-position: 0% 50%;
      }

      50%{
        background-position: 100% 50%;
      }

      100%{
        background-position: 0% 50%;
      }

    }

    .glass{
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .fade-up{
      animation: fadeUp 1s ease;
    }

    @keyframes fadeUp{

      from{
        opacity: 0;
        transform: translateY(20px);
      }

      to{
        opacity: 1;
        transform: translateY(0);
      }

    }

    input,
    textarea{
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
    }

    input::placeholder,
    textarea::placeholder{
      color: #d1d5db;
    }

    input:focus,
    textarea:focus{
      outline: none;
      border-color: #a855f7;
      box-shadow: 0 0 15px rgba(168,85,247,0.5);
    }

  </style>

</head>

<body>

  <!-- Navbar -->
  <nav class="glass flex items-center justify-between px-8 py-4 sticky top-0 z-50">

    <h1 class="text-3xl font-bold">
      Travel<span class="text-purple-400">oop</span>
    </h1>

    <button
      onclick="window.location.href='dashboard.html'"
      class="px-5 py-2 rounded-xl bg-purple-500 hover:bg-purple-600 transition"
    >
      ← Dashboard
    </button>

  </nav>

  <!-- Main -->
  <section class="px-6 md:px-12 py-12 fade-up">

    <div class="max-w-4xl mx-auto glass rounded-3xl p-8 md:p-12">

      <!-- Heading -->
      <h2 class="text-5xl font-bold text-center">
        Create New Trip ✈️
      </h2>

      <p class="text-center text-gray-300 mt-4">
        Start planning your dream vacation
      </p>

      <!-- Form -->
      <form id="tripForm" class="grid md:grid-cols-2 gap-6 mt-10">

        <!-- Trip Name -->
        <div class="md:col-span-2">

          <label class="block mb-2 text-lg">
            Trip Name
          </label>

          <input
            type="text"
            id="tripName"
            placeholder="Goa Vacation"
            required
            class="w-full px-5 py-4 rounded-2xl"
          >

        </div>

        <!-- Destination -->
        <div>

          <label class="block mb-2 text-lg">
            Destination
          </label>

          <input
            type="text"
            id="destination"
            placeholder="Goa"
            required
            class="w-full px-5 py-4 rounded-2xl"
          >

        </div>

        <!-- Budget -->
        <div>

          <label class="block mb-2 text-lg">
            Budget (₹)
          </label>

          <input
            type="number"
            id="budget"
            placeholder="25000"
            required
            class="w-full px-5 py-4 rounded-2xl"
          >

        </div>

        <!-- Start Date -->
        <div>

          <label class="block mb-2 text-lg">
            Start Date
          </label>

          <input
            type="date"
            id="startDate"
            required
            class="w-full px-5 py-4 rounded-2xl"
          >

        </div>

        <!-- End Date -->
        <div>

          <label class="block mb-2 text-lg">
            End Date
          </label>

          <input
            type="date"
            id="endDate"
            required
            class="w-full px-5 py-4 rounded-2xl"
          >

        </div>

        <!-- Description -->
        <div class="md:col-span-2">

          <label class="block mb-2 text-lg">
            Trip Description
          </label>

          <textarea
            id="description"
            rows="5"
            placeholder="Describe your journey..."
            class="w-full px-5 py-4 rounded-2xl"
          ></textarea>

        </div>

        <!-- Button -->
        <div class="md:col-span-2 text-center mt-4">

          <button
            type="submit"
            class="px-10 py-4 rounded-2xl bg-gradient-to-r from-purple-500 to-blue-500 hover:scale-105 transition duration-300 font-semibold text-lg shadow-2xl"
          >
            Save Trip 🚀
          </button>

        </div>

      </form>

    </div>

  </section>

  <!-- JavaScript -->
  <script>

    // Form
    const tripForm =
      document.getElementById("tripForm");

    // Submit Event
    tripForm.addEventListener("submit", function(e){

      // Prevent Refresh
      e.preventDefault();

      // Create Trip Object
      const tripData = {

        tripName:
          document.getElementById("tripName").value,

        destination:
          document.getElementById("destination").value,

        budget:
          document.getElementById("budget").value,

        startDate:
          document.getElementById("startDate").value,

        endDate:
          document.getElementById("endDate").value,

        description:
          document.getElementById("description").value

      };

      // Save In LocalStorage
      localStorage.setItem(
        "traveloopTrip",
        JSON.stringify(tripData)
      );

      // Success Alert
      alert("Trip Saved Successfully ✈️");

      // Open My Trips Page
      window.location.href =
        "mytrip.html";

    });

  </script>

</body>
</html>
