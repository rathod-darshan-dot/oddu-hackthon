<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Travel Notes - Traveloop</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      background:linear-gradient(-45deg,#0f172a,#1e3a8a,#7c3aed,#0f172a);
      background-size:400% 400%;
      animation:gradient 10s ease infinite;
      color:white;
      overflow-x:hidden;
    }

    @keyframes gradient{

      0%{
        background-position:0% 50%;
      }

      50%{
        background-position:100% 50%;
      }

      100%{
        background-position:0% 50%;
      }

    }

    .glass{
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(14px);
      border:1px solid rgba(255,255,255,0.1);
      box-shadow:0 8px 32px rgba(0,0,0,0.3);
    }

    .fade-up{
      animation:fadeUp 1s ease;
    }

    @keyframes fadeUp{

      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }

    .card-hover:hover{
      transform:translateY(-8px) scale(1.02);
      transition:0.4s;
    }

    textarea{

      resize:none;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      color:white;

    }

    textarea::placeholder{
      color:#d1d5db;
    }

    textarea:focus{
      outline:none;
      border-color:#a855f7;
      box-shadow:0 0 15px rgba(168,85,247,0.5);
    }

    .floating{
      animation:floating 4s ease-in-out infinite;
    }

    @keyframes floating{

      0%{
        transform:translateY(0px);
      }

      50%{
        transform:translateY(-10px);
      }

      100%{
        transform:translateY(0px);
      }

    }

  </style>

</head>

<body>

  <!-- Navbar -->
  <nav class="glass flex items-center justify-between px-8 py-4 sticky top-0 z-50">

    <h1 class="text-3xl font-bold">
      Travel<span class="text-purple-400">oop</span>
    </h1>

    <button
      onclick="window.location.href='profile.html'"
      class="px-5 py-2 rounded-xl bg-purple-500 hover:bg-purple-600 transition"
    >
      ← Profile
    </button>

  </nav>

  <!-- Hero -->
  <section class="px-6 md:px-12 py-16 fade-up">

    <div class="glass rounded-[40px] p-10 md:p-16 text-center">

      <div class="floating">

        <div class="text-8xl">
          📝
        </div>

      </div>

      <h1 class="text-5xl md:text-7xl font-bold mt-10 leading-tight">

        Travel
        <span class="text-purple-400">
          Notes
        </span>

      </h1>

      <p class="text-gray-300 text-lg md:text-2xl mt-8 max-w-3xl mx-auto leading-relaxed">

        Save memories,
        reminders,
        hotel information,
        emergency contacts,
        and your personal travel experiences.

      </p>

    </div>

  </section>

  <!-- Trip Details -->
  <section class="px-6 md:px-12 pb-12 fade-up">

    <div class="grid md:grid-cols-3 gap-6">

      <!-- Trip Name -->
      <div class="glass rounded-3xl p-8 card-hover text-center">

        <p class="text-gray-300 text-lg">
          Trip Name
        </p>

        <h2
          id="tripName"
          class="text-3xl font-bold mt-4"
        >
          -
        </h2>

      </div>

      <!-- Destination -->
      <div class="glass rounded-3xl p-8 card-hover text-center">

        <p class="text-gray-300 text-lg">
          Destination
        </p>

        <h2
          id="destination"
          class="text-3xl font-bold mt-4"
        >
          -
        </h2>

      </div>

      <!-- Budget -->
      <div class="glass rounded-3xl p-8 card-hover text-center">

        <p class="text-gray-300 text-lg">
          Budget
        </p>

        <h2
          id="budget"
          class="text-3xl font-bold mt-4 text-green-400"
        >
          -
        </h2>

      </div>

    </div>

  </section>

  <!-- Notes Input -->
  <section class="px-6 md:px-12 pb-12 fade-up">

    <div class="glass rounded-[35px] p-10">

      <h2 class="text-4xl font-bold mb-10 text-center">
        Add Your Notes
      </h2>

      <textarea
        id="notesInput"
        rows="10"
        placeholder="Write hotel details, memories, reminders, emergency contacts..."
        class="w-full rounded-3xl p-6 text-lg"
      ></textarea>

      <!-- Buttons -->
      <div class="flex flex-wrap justify-center gap-6 mt-10">

        <!-- Save -->
        <button
          onclick="saveNotes()"
          class="px-10 py-4 rounded-2xl bg-gradient-to-r from-purple-500 to-blue-500 hover:scale-105 transition duration-300 text-lg font-semibold shadow-2xl"
        >
          Save Notes 💾
        </button>

        <!-- Clear -->
        <button
          onclick="clearNotes()"
          class="px-10 py-4 rounded-2xl bg-gradient-to-r from-red-500 to-pink-500 hover:scale-105 transition duration-300 text-lg font-semibold shadow-2xl"
        >
          Clear Notes
        </button>

      </div>

    </div>

  </section>

  <!-- Saved Notes -->
  <section class="px-6 md:px-12 pb-16 fade-up">

    <div class="glass rounded-[35px] p-10">

      <h2 class="text-4xl font-bold mb-10 text-center">
        Saved Notes
      </h2>

      <div
        id="savedNotes"
        class="glass rounded-3xl p-8 text-lg text-gray-200 leading-relaxed min-h-[200px]"
      >
        No notes added yet...
      </div>

    </div>

  </section>

  <!-- Final Buttons -->
  <section class="px-6 md:px-12 pb-20 fade-up">

    <div class="flex flex-wrap justify-center gap-6">

      <!-- Dashboard -->
      <button
        onclick="window.location.href='dashboard.html'"
        class="px-10 py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-500 hover:scale-105 transition duration-300 text-lg font-semibold shadow-2xl"
      >
        Dashboard
      </button>

      <!-- New Trip -->
      <button
        onclick="window.location.href='create.html'"
        class="px-10 py-4 rounded-2xl bg-gradient-to-r from-green-500 to-emerald-500 hover:scale-105 transition duration-300 text-lg font-semibold shadow-2xl"
      >
        Create New Trip ✈️
      </button>

      <!-- Logout -->
      <button
        onclick="logoutUser()"
        class="px-10 py-4 rounded-2xl bg-gradient-to-r from-red-500 to-pink-500 hover:scale-105 transition duration-300 text-lg font-semibold shadow-2xl"
      >
        Logout
      </button>

    </div>

  </section>

  <!-- JavaScript -->
  <script>

    // Load Trip Data
    const tripData =
      JSON.parse(localStorage.getItem("traveloopTrip"));

    // Show Trip Data
    if(tripData){

      document.getElementById("tripName").innerText =
        tripData.tripName || "My Trip";

      document.getElementById("destination").innerText =
        tripData.destination || "Destination";

      document.getElementById("budget").innerText =
        "₹" + (tripData.budget || 0);

    }

    // Load Saved Notes
    const savedNotes =
      localStorage.getItem("traveloopNotes");

    if(savedNotes){

      document.getElementById("savedNotes").innerText =
        savedNotes;

      document.getElementById("notesInput").value =
        savedNotes;

    }

    // Save Notes
    function saveNotes(){

      const notes =
        document.getElementById("notesInput").value;

      if(notes.trim() === ""){

        alert(
          "Please write some notes first"
        );

        return;

      }

      localStorage.setItem(
        "traveloopNotes",
        notes
      );

      document.getElementById("savedNotes").innerText =
        notes;

      alert(
        "Notes Saved Successfully 💾"
      );

    }

    // Clear Notes
    function clearNotes(){

      localStorage.removeItem(
        "traveloopNotes"
      );

      document.getElementById("notesInput").value =
        "";

      document.getElementById("savedNotes").innerText =
        "No notes added yet...";

      alert(
        "Notes Cleared Successfully"
      );

    }

    // Logout
    function logoutUser(){

      alert(
        "Logged Out Successfully"
      );

      window.location.href =
        "login.html";

    }

  </script>

</body>
</html>
