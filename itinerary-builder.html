<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Itinerary Builder - Traveloop</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      background:linear-gradient(-45deg,#0f172a,#1e3a8a,#7c3aed,#0f172a);
      background-size:400% 400%;
      animation:gradient 10s ease infinite;
      color:white;
      overflow-x:hidden;
    }

    @keyframes gradient{

      0%{
        background-position:0% 50%;
      }

      50%{
        background-position:100% 50%;
      }

      100%{
        background-position:0% 50%;
      }

    }

    .glass{
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(14px);
      border:1px solid rgba(255,255,255,0.1);
      box-shadow:0 8px 32px rgba(0,0,0,0.3);
    }

    .fade-up{
      animation:fadeUp 1s ease;
    }

    @keyframes fadeUp{

      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }

    .card-hover:hover{
      transform:translateY(-8px) scale(1.02);
      transition:0.4s;
    }

    input,
    textarea{
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      color:white;
    }

    input::placeholder,
    textarea::placeholder{
      color:#d1d5db;
    }

    input:focus,
    textarea:focus{
      outline:none;
      border-color:#a855f7;
      box-shadow:0 0 15px rgba(168,85,247,0.5);
    }

  </style>

</head>

<body>

  <!-- Navbar -->
  <nav class="glass flex items-center justify-between px-8 py-4 sticky top-0 z-50">

    <h1 class="text-3xl font-bold">
      Travel<span class="text-purple-400">oop</span>
    </h1>

    <button
      onclick="window.location.href='mytrips.html'"
      class="px-5 py-2 rounded-xl bg-purple-500 hover:bg-purple-600 transition"
    >
      ← My Trips
    </button>

  </nav>

  <!-- Hero -->
  <section class="px-6 md:px-12 py-12 fade-up">

    <div class="glass rounded-3xl p-8 md:p-12">

      <h2 class="text-5xl font-bold">
        Itinerary Builder ✈️
      </h2>

      <p class="text-gray-300 mt-5 text-lg">
        Add trip stops, travel dates, and activities.
      </p>

    </div>

  </section>

  <!-- Trip Summary -->
  <section class="px-6 md:px-12 fade-up">

    <div class="grid md:grid-cols-3 gap-6">

      <!-- Trip Name -->
      <div class="glass rounded-3xl p-6 card-hover">

        <p class="text-gray-300">
          Trip Name
        </p>

        <h3
          id="tripName"
          class="text-3xl font-bold mt-3"
        >
          -
        </h3>

      </div>

      <!-- Destination -->
      <div class="glass rounded-3xl p-6 card-hover">

        <p class="text-gray-300">
          Destination
        </p>

        <h3
          id="destination"
          class="text-3xl font-bold mt-3"
        >
          -
        </h3>

      </div>

      <!-- Budget -->
      <div class="glass rounded-3xl p-6 card-hover">

        <p class="text-gray-300">
          Budget
        </p>

        <h3
          id="budget"
          class="text-3xl font-bold mt-3 text-green-400"
        >
          -
        </h3>

      </div>

    </div>

  </section>

  <!-- Stops -->
  <section class="px-6 md:px-12 py-14 fade-up">

    <div class="flex items-center justify-between mb-8">

      <h2 class="text-4xl font-bold">
        Trip Stops
      </h2>

      <button
        onclick="addStop()"
        class="px-6 py-3 rounded-2xl bg-gradient-to-r from-purple-500 to-blue-500 hover:scale-105 transition font-semibold"
      >
        + Add Stop
      </button>

    </div>

    <!-- Stops Container -->
    <div
      id="stopsContainer"
      class="space-y-8"
    >

    </div>

  </section>

  <!-- Save -->
  <section class="px-6 md:px-12 pb-20 text-center fade-up">

    <button
      onclick="saveItinerary()"
      class="px-10 py-4 rounded-2xl bg-gradient-to-r from-green-500 to-emerald-500 hover:scale-105 transition duration-300 font-semibold text-lg shadow-2xl"
    >
      Save Itinerary 🚀
    </button>

  </section>

  <!-- JavaScript -->
  <script>

    // Load Trip Data
    const tripData =
      JSON.parse(localStorage.getItem("traveloopTrip"));

    // Show Data
    if(tripData){

      document.getElementById("tripName").innerText =
        tripData.tripName;

      document.getElementById("destination").innerText =
        tripData.destination;

      document.getElementById("budget").innerText =
        "₹" + tripData.budget;

    }

    // Stops Container
    const stopsContainer =
      document.getElementById("stopsContainer");

    // Counter
    let stopCount = 0;

    // Add Stop
    function addStop(){

      stopCount++;

      const stopCard =
        document.createElement("div");

      stopCard.className =
        "glass rounded-3xl p-8 card-hover";

      stopCard.innerHTML = `

        <div class="flex items-center justify-between mb-6">

          <h3 class="text-3xl font-bold">
            Stop ${stopCount}
          </h3>

          <button
            onclick="this.parentElement.parentElement.remove()"
            class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-xl transition"
          >
            Delete
          </button>

        </div>

        <!-- City -->
        <div class="mb-5">

          <label class="block mb-2 text-lg">
            City
          </label>

          <input
            type="text"
            placeholder="Enter City Name"
            class="w-full px-5 py-4 rounded-2xl"
          >

        </div>

        <!-- Dates -->
        <div class="grid md:grid-cols-2 gap-5 mb-5">

          <div>

            <label class="block mb-2 text-lg">
              Start Date
            </label>

            <input
              type="date"
              class="w-full px-5 py-4 rounded-2xl"
            >

          </div>

          <div>

            <label class="block mb-2 text-lg">
              End Date
            </label>

            <input
              type="date"
              class="w-full px-5 py-4 rounded-2xl"
            >

          </div>

        </div>

        <!-- Activities -->
        <div>

          <label class="block mb-2 text-lg">
            Activities
          </label>

          <textarea
            rows="4"
            placeholder="Beach Visit, Shopping, Dinner..."
            class="w-full px-5 py-4 rounded-2xl"
          ></textarea>

        </div>

      `;

      stopsContainer.appendChild(stopCard);

    }

    // Save Itinerary
    function saveItinerary(){

      alert("Itinerary Saved Successfully ✈️");

      // Open Next Page
      window.location.href =
        "itinerary-view.html";

    }

  </script>

</body>
</html>
