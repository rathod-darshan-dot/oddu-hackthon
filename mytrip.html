<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>My Trips - Traveloop</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      background:linear-gradient(-45deg,#0f172a,#1e3a8a,#7c3aed,#0f172a);
      background-size:400% 400%;
      animation:gradient 10s ease infinite;
      color:white;
      overflow-x:hidden;
    }

    @keyframes gradient{

      0%{
        background-position:0% 50%;
      }

      50%{
        background-position:100% 50%;
      }

      100%{
        background-position:0% 50%;
      }

    }

    .glass{
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(14px);
      border:1px solid rgba(255,255,255,0.1);
      box-shadow:0 8px 32px rgba(0,0,0,0.3);
    }

    .fade-up{
      animation:fadeUp 1s ease;
    }

    @keyframes fadeUp{

      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }

    .card-hover:hover{
      transform:translateY(-8px) scale(1.02);
      transition:0.4s;
    }

    .floating{
      animation:floating 4s ease-in-out infinite;
    }

    @keyframes floating{

      0%{
        transform:translateY(0px);
      }

      50%{
        transform:translateY(-10px);
      }

      100%{
        transform:translateY(0px);
      }

    }

  </style>

</head>

<body>

  <!-- Navbar -->
  <nav class="glass flex items-center justify-between px-8 py-4 sticky top-0 z-50">

    <h1 class="text-3xl font-bold">
      Travel<span class="text-purple-400">oop</span>
    </h1>

    <button
      onclick="window.location.href='dashboard.html'"
      class="px-5 py-2 rounded-xl bg-purple-500 hover:bg-purple-600 transition"
    >
      ← Dashboard
    </button>

  </nav>

  <!-- Hero -->
  <section class="px-6 md:px-12 py-12 fade-up">

    <div class="grid lg:grid-cols-2 gap-10 items-center">

      <!-- Left -->
      <div>

        <h2 class="text-5xl md:text-6xl font-bold leading-tight">
          My
          <span class="text-purple-400">
            Trips ✈️
          </span>
        </h2>

        <p class="text-gray-300 mt-6 text-lg max-w-xl leading-relaxed">
          Organize your journeys,
          manage vacations,
          and continue building your dream adventures.
        </p>

        <button
          onclick="window.location.href='create.html'"
          class="mt-8 px-8 py-4 rounded-2xl bg-gradient-to-r from-purple-500 to-blue-500 hover:scale-105 transition duration-300 font-semibold text-lg shadow-2xl"
        >
          + Create Another Trip
        </button>

      </div>

      <!-- Right -->
      <div class="floating">

        <img
          src="https://images.unsplash.com/photo-1502920917128-1aa500764ce7?q=80&w=1200&auto=format&fit=crop"
          class="rounded-3xl shadow-2xl"
        />

      </div>

    </div>

  </section>

  <!-- Trips -->
  <section class="px-6 md:px-12 pb-20 fade-up">

    <h2 class="text-4xl font-bold mb-10">
      Your Saved Trips
    </h2>

    <!-- Container -->
    <div
      id="tripContainer"
      class="grid md:grid-cols-2 xl:grid-cols-3 gap-8"
    >

    </div>

  </section>

  <!-- JavaScript -->
  <script>

    // Get Saved Trip
    const tripData =
      JSON.parse(localStorage.getItem("traveloopTrip"));

    // Container
    const tripContainer =
      document.getElementById("tripContainer");

    // If Trip Exists
    if(tripData){

      tripContainer.innerHTML = `

        <div class="glass rounded-3xl overflow-hidden card-hover">

          <!-- Image -->
          <img
            src="https://images.unsplash.com/photo-1526772662000-3f88f10405ff?q=80&w=1200&auto=format&fit=crop"
            class="h-56 w-full object-cover"
          />

          <!-- Content -->
          <div class="p-6">

            <!-- Trip Name -->
            <h3 class="text-3xl font-bold">
              ${tripData.tripName}
            </h3>

            <!-- Destination -->
            <p class="text-purple-300 mt-3 text-lg">
              📍 ${tripData.destination}
            </p>

            <!-- Dates -->
            <p class="text-gray-300 mt-5">
              📅 ${tripData.startDate}
              →
              ${tripData.endDate}
            </p>

            <!-- Budget -->
            <p class="text-green-400 font-semibold mt-3">
              💰 Budget: ₹${tripData.budget}
            </p>

            <!-- Description -->
            <p class="text-gray-300 mt-5">
              ${tripData.description}
            </p>

            <!-- Buttons -->
            <div class="flex gap-4 mt-8">

              <!-- Open Trip -->
              <button
                onclick="openTrip()"
                class="flex-1 py-3 rounded-2xl bg-gradient-to-r from-purple-500 to-blue-500 hover:scale-105 transition duration-300 font-semibold"
              >
                Open Trip
              </button>

              <!-- Delete -->
              <button
                onclick="deleteTrip()"
                class="px-5 py-3 rounded-2xl bg-red-500 hover:bg-red-600 transition"
              >
                🗑
              </button>

            </div>

          </div>

        </div>

      `;

    }

    // If No Trips
    else{

      tripContainer.innerHTML = `

        <div class="glass rounded-3xl p-12 text-center col-span-full">

          <img
            src="https://cdn-icons-png.flaticon.com/512/854/854878.png"
            class="w-28 mx-auto opacity-80"
          />

          <h3 class="text-3xl font-bold mt-6">
            No Trips Found
          </h3>

          <p class="text-gray-300 mt-4">
            Create your first dream trip now.
          </p>

          <button
            onclick="window.location.href='create.html'"
            class="mt-8 px-8 py-4 rounded-2xl bg-gradient-to-r from-purple-500 to-blue-500 hover:scale-105 transition duration-300 font-semibold text-lg"
          >
            Create Trip 🚀
          </button>

        </div>

      `;

    }

    // Open Trip Function
    function openTrip(){

      // Open Itinerary Builder Page
      window.location.href =
        "itinerary-builder.html";

    }

    // Delete Trip Function
    function deleteTrip(){

      const confirmDelete =
        confirm("Are you sure you want to delete this trip?");

      if(confirmDelete){

        localStorage.removeItem("traveloopTrip");

        alert("Trip Deleted Successfully");

        location.reload();

      }

    }

  </script>

</body>
</html>
