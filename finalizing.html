<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Finalizing Trip - Traveloop</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      background:linear-gradient(-45deg,#0f172a,#1e3a8a,#7c3aed,#0f172a);
      background-size:400% 400%;
      animation:gradient 10s ease infinite;
      color:white;
    }

    @keyframes gradient{

      0%{
        background-position:0% 50%;
      }

      50%{
        background-position:100% 50%;
      }

      100%{
        background-position:0% 50%;
      }

    }

    .glass{
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(15px);
      border:1px solid rgba(255,255,255,0.1);
      box-shadow:0 8px 32px rgba(0,0,0,0.3);
    }

    .floating{
      animation:floating 4s ease-in-out infinite;
    }

    @keyframes floating{

      0%{
        transform:translateY(0px);
      }

      50%{
        transform:translateY(-15px);
      }

      100%{
        transform:translateY(0px);
      }

    }

    .fade-up{
      animation:fadeUp 1.2s ease;
    }

    @keyframes fadeUp{

      from{
        opacity:0;
        transform:translateY(30px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }

    .loader{

      width:120px;
      height:120px;
      border-radius:50%;
      border:8px solid rgba(255,255,255,0.15);
      border-top:8px solid #a855f7;
      animation:spin 1s linear infinite;
      margin:auto;

    }

    @keyframes spin{

      100%{
        transform:rotate(360deg);
      }

    }

    .glow{
      box-shadow:0 0 35px rgba(168,85,247,0.5);
    }

    .confetti{
      position:absolute;
      width:10px;
      height:10px;
      border-radius:50%;
      top:-20px;
      animation:fall linear infinite;
      opacity:0.8;
    }

    @keyframes fall{

      to{
        transform:translateY(120vh) rotate(360deg);
      }

    }

    .progress-container{
      width:100%;
      height:16px;
      background:rgba(255,255,255,0.15);
      border-radius:20px;
      overflow:hidden;
      margin-top:30px;
    }

    .progress-bar{
      height:100%;
      width:0%;
      background:linear-gradient(to right,#8b5cf6,#06b6d4);
      border-radius:20px;
      animation:loading 5s linear forwards;
    }

    @keyframes loading{

      0%{
        width:0%;
      }

      100%{
        width:100%;
      }

    }

  </style>

</head>

<body>

  <!-- Confetti -->
  <script>

    for(let i = 0; i < 70; i++){

      const confetti =
        document.createElement("div");

      confetti.className = "confetti";

      confetti.style.left =
        Math.random() * 100 + "vw";

      confetti.style.animationDuration =
        (Math.random() * 4 + 2) + "s";

      confetti.style.background =
        `hsl(${Math.random()*360},100%,70%)`;

      document.body.appendChild(confetti);

    }

  </script>

  <!-- Main Card -->
  <div class="glass rounded-[40px] p-10 md:p-16 max-w-4xl w-full text-center fade-up glow relative z-10 mx-5">

    <!-- Floating Icon -->
    <div class="floating">

      <div class="text-8xl">
        ✈️
      </div>

    </div>

    <!-- Title -->
    <h1 class="text-5xl md:text-7xl font-bold mt-8 leading-tight">

      Finalizing
      <span class="text-purple-400">
        Your Trip
      </span>

    </h1>

    <!-- Description -->
    <p class="text-gray-300 text-lg md:text-2xl mt-8 leading-relaxed max-w-3xl mx-auto">

      Please wait while Traveloop prepares your itinerary,
      budget planning,
      travel checklist,
      and complete smart journey experience.

    </p>

    <!-- Loader -->
    <div class="mt-14">

      <div class="loader"></div>

    </div>

    <!-- Progress -->
    <div class="progress-container">

      <div class="progress-bar"></div>

    </div>

    <!-- Status -->
    <div
      id="statusText"
      class="mt-8 text-xl md:text-2xl text-green-400 font-semibold"
    >
      Preparing Your Travel Experience...
    </div>

  </div>

  <!-- Status Changing -->
  <script>

    const statusText =
      document.getElementById("statusText");

    const messages = [

      "Preparing Your Travel Experience...",
      "Optimizing Trip Budget...",
      "Creating Smart Itinerary...",
      "Checking Packing Essentials...",
      "Almost Ready..."
    ];

    let index = 0;

    setInterval(() => {

      index++;

      if(index < messages.length){

        statusText.innerText =
          messages[index];

      }

    }, 1000);

  </script>

  <!-- Auto Redirect -->
  <script>

    setTimeout(() => {

      window.location.href =
        "finish.html";

    }, 5000);

  </script>

</body>
</html>
