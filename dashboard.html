<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Traveloop Dashboard</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      font-family: 'Poppins', sans-serif;
    }

    body{
      background: linear-gradient(-45deg,#0f172a,#1e3a8a,#7c3aed,#0f172a);
      background-size: 400% 400%;
      animation: gradient 10s ease infinite;
      overflow-x: hidden;
      color: white;
    }

    @keyframes gradient{
      0%{
        background-position: 0% 50%;
      }
      50%{
        background-position: 100% 50%;
      }
      100%{
        background-position: 0% 50%;
      }
    }

    .glass{
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .card-hover:hover{
      transform: translateY(-8px) scale(1.02);
      transition: 0.4s;
    }

    .fade-up{
      animation: fadeUp 1s ease;
    }

    @keyframes fadeUp{
      from{
        opacity: 0;
        transform: translateY(25px);
      }
      to{
        opacity: 1;
        transform: translateY(0);
      }
    }

    .floating{
      animation: floating 4s ease-in-out infinite;
    }

    @keyframes floating{
      0%{
        transform: translateY(0px);
      }
      50%{
        transform: translateY(-12px);
      }
      100%{
        transform: translateY(0px);
      }
    }

  </style>
</head>

<body class="min-h-screen">

  <!-- Navbar -->
  <nav class="glass flex items-center justify-between px-8 py-4 sticky top-0 z-50">

    <!-- Logo -->
    <h1 class="text-3xl font-bold">
      Travel<span class="text-purple-400">oop</span>
    </h1>

    <!-- Right -->
    <div class="flex items-center gap-5">

      <p id="welcomeUser" class="text-gray-200 hidden md:block"></p>

      <button
        onclick="logout()"
        class="px-5 py-2 rounded-xl bg-red-500 hover:bg-red-600 transition"
      >
        Logout
      </button>

    </div>

  </nav>

  <!-- Hero Section -->
  <section class="px-6 md:px-12 py-12 fade-up">

    <div class="grid lg:grid-cols-2 gap-10 items-center">

      <!-- Left -->
      <div>

        <h2 class="text-5xl md:text-6xl font-bold leading-tight">
          Welcome Back
          <span class="text-purple-400">
            Traveler ✈️
          </span>
        </h2>

        <p class="text-gray-300 mt-6 text-lg max-w-xl leading-relaxed">
          Plan trips, organize destinations,
          track your travel budget,
          and create unforgettable journeys.
        </p>

        <!-- Create Trip Button -->
        <button
          onclick="window.location.href='create.html'"
          class="mt-8 px-8 py-4 rounded-2xl bg-gradient-to-r from-purple-500 to-blue-500 hover:scale-105 transition duration-300 font-semibold text-lg shadow-2xl"
        >
          + Plan New Trip
        </button>

      </div>

      <!-- Right Image -->
      <div class="floating">

        <img
          src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200&auto=format&fit=crop"
          class="rounded-3xl shadow-2xl"
        />

      </div>

    </div>

  </section>

  <!-- Stats -->
  <section class="px-6 md:px-12 grid md:grid-cols-3 gap-6 fade-up">

    <!-- Trips -->
    <div class="glass p-6 rounded-3xl card-hover">

      <h3 class="text-gray-300">
        Total Trips
      </h3>

      <p class="text-5xl font-bold mt-3">
        0
      </p>

    </div>

    <!-- Countries -->
    <div class="glass p-6 rounded-3xl card-hover">

      <h3 class="text-gray-300">
        Countries Visited
      </h3>

      <p class="text-5xl font-bold mt-3">
        0
      </p>

    </div>

    <!-- Budget -->
    <div class="glass p-6 rounded-3xl card-hover">

      <h3 class="text-gray-300">
        Total Budget
      </h3>

      <p class="text-5xl font-bold mt-3">
        ₹0
      </p>

    </div>

  </section>

  <!-- Recent Trips -->
  <section class="px-6 md:px-12 mt-16 pb-14 fade-up">

    <div class="flex items-center justify-between mb-8">

      <h2 class="text-3xl font-bold">
        Recent Trips
      </h2>

      <button class="text-purple-300 hover:text-purple-400 transition">
        View All
      </button>

    </div>

    <!-- Empty State -->
    <div class="glass rounded-3xl p-12 text-center">

      <img
        src="https://cdn-icons-png.flaticon.com/512/201/201623.png"
        class="w-28 mx-auto opacity-80"
      />

      <h3 class="text-3xl font-bold mt-6">
        No Trips Yet
      </h3>

      <p class="text-gray-300 mt-4">
        Start planning your first dream vacation now.
      </p>

      <!-- Create Trip Button -->
      <button
        onclick="window.location.href='create.html'"
        class="mt-8 px-8 py-4 rounded-2xl bg-gradient-to-r from-purple-500 to-blue-500 hover:scale-105 transition duration-300 font-semibold text-lg"
      >
        Create Your First Trip 🚀
      </button>

    </div>

  </section>

  <!-- JavaScript -->
  <script>

    // Check Login
    const user = localStorage.getItem("traveloopUser");

    if(!user){

      window.location.href = "login.html";

    }

    // Show User Email
    document.getElementById("welcomeUser").innerText =
      "👋 " + user;

    // Logout Function
    function logout(){

      localStorage.removeItem("traveloopUser");

      alert("Logged Out Successfully");

      window.location.href = "login.html";

    }

  </script>

</body>
</html>
